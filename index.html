<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plán směn</title>
<style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#14213d;color:white;padding:20px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#cbd5e1}.headright{display:flex;align-items:center;gap:12px;font-size:13px}main{max-width:1100px;margin:22px auto;padding:0 14px}.bar,.panel{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:14px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nav,.actions{display:flex;align-items:center;gap:8px}button{border:1px solid #d8dee8;background:white;border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#f1f5f9}button:disabled{opacity:.5;cursor:wait}h2{font-size:19px;margin:0;text-transform:capitalize;min-width:180px;text-align:center}.primary{background:#2563eb;color:white;border-color:#2563eb}.grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;font-size:12px;color:#687386;font-weight:700;padding:8px}.week div:nth-child(6){background:#f1f3f5;border-radius:7px}.week div:nth-child(7){background:#e9edf1;border-radius:7px}.day{min-height:100px;text-align:left;vertical-align:top;padding:7px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid #e1e5eb;border-radius:7px}.day.out{background:#f7f8fa;color:#a0a8b6}#days>.day:nth-child(7n+6){background:#f1f3f5}#days>.day:nth-child(7n+7){background:#e9edf1}.num{font-weight:750;font-size:13px}.tag{font-size:11px;color:#111827;padding:4px 5px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.people{display:flex;flex-direction:column;gap:8px}.person{display:flex;align-items:center;gap:8px}.person input{min-width:0;width:100%;padding:8px;border:1px solid #d8dee8;border-radius:8px;font:inherit}.swatch{width:12px;height:12px;border-radius:50%;flex:none}.stats{border-top:1px solid #e3e8ef;margin-top:16px;padding-top:12px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.muted{font-size:12px;color:#687386;line-height:1.5}.back{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.back.show{display:flex}.modal{background:white;border-radius:15px;padding:20px;width:min(420px,100%);box-shadow:0 20px 60px #0003}.modal input[type=email],.modal input[type=password]{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;font:inherit;margin:6px 0 12px}.opt{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #e3e8ef;border-radius:9px;margin:8px 0}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.error{color:#b42318;font-size:13px;min-height:20px}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}.day{min-height:75px;padding:4px}.tag{font-size:9px;padding:3px}.week,.days{gap:3px}header{align-items:flex-start}.headright{flex-direction:column;align-items:flex-end}}@media print{header{background:white;color:black;padding:0 0 12px}.headright,header p{display:none}main{margin:0;padding:0}.actions,.side{display:none!important}.bar{border:0}.day{min-height:90px}}
</style></head><body>
<header><div><h1>Plán směn</h1><p>Měsíční přehled denních směn</p></div><div class="headright"><span id="who"></span><button id="logout" class="hidden">Odhlásit</button></div></header>
<main id="app" class="hidden">
<section class="bar"><div class="nav"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div class="actions"><button id="today">Dnes</button><button id="print">Tisk</button></div></section>
<div class="grid"><section class="panel"><div class="week"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="days" id="days"></div></section>
<aside class="panel side"><b>Pracovníci</b><div class="people" id="people" style="margin-top:12px"></div><p class="muted">Jména a směny se ukládají online do společné databáze.</p><div class="stats"><b>Směny v měsíci</b><div id="stats"></div></div></aside></div>
<p class="muted" id="status">Připojeno k databázi.</p></main>
<div class="back show" id="login"><div class="modal"><h2 style="text-align:left">Přihlášení</h2><div class="nav" style="margin:12px 0"><button type="button" id="adminTab" class="primary">Správce</button><button type="button" id="workerTab">Pracovník</button></div><section id="adminLogin"><p class="muted">Přihlášení e-mailem a heslem správce.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required value="didaktik1234@gmail.com"><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit" style="width:100%">Přihlásit</button></form><div class="error" id="loginError"></div></section><section id="workerLogin" class="hidden"><p class="muted">Vyber své jméno a zadej čtyřmístný PIN.</p><form id="workerLoginForm"><label for="workerName">Pracovník</label><select id="workerName" required style="width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;margin:6px 0 12px;font:inherit"><option value="915e7bb9-f2ed-46da-bc16-3862b2b41796">Naďa</option><option value="56d5a765-b9b9-4f59-bbfa-554d50185fc9">Táňa</option><option value="39ab9d80-0fd0-414c-9667-87860d816279">Dion</option></select><label for="workerPin">PIN</label><input id="workerPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required style="width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;margin:6px 0 12px;font:inherit"><button class="primary" type="submit" style="width:100%">Přihlásit</button></form><div class="error" id="workerError"></div></section></div></div>
<div class="back" id="back"><div class="modal"><h3 id="date"></h3><p class="muted">Kdo má v tento den denní směnu?</p><div id="opts"></div><div class="foot"><button id="clear">Vymazat</button><button id="cancel">Zavřít</button><button class="primary" id="save">Uložit</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=> {
const SUPABASE_URL='https://bdfswtldqpfveqqcxrgy.supabase.co';
const SUPABASE_KEY='sb_publishable_uL6CdJeABYQDUhYN6R0_kQ_hZ0wJn4E';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const colors=['#bfdbfe','#bbf7d0','#fed7aa'],today=new Date(),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/worker-access';let workerToken=sessionStorage.getItem('workerSession')||'',workerId='',mode='admin';
async function workerCall(action,data={},token=workerToken){const headers={'Content-Type':'application/json','apikey':SUPABASE_KEY};if(token){if(action==='set-pin')headers.Authorization='Bearer '+token;else headers['x-worker-session']=token}const r=await fetch(FUNCTION_URL,{method:'POST',headers,body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Požadavek se nezdařil.');return j}
let month=new Date(today.getFullYear(),today.getMonth(),1),selected='',draft=[],draftTimes={},employees=[],shifts={};
const dateId=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const label=d=>new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(d);
const monthName=d=>new Intl.DateTimeFormat('cs-CZ',{month:'long',year:'numeric'}).format(d);
function status(s){$('status').textContent=s}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadData(){
 status('Načítám směny…');
 if(mode==='worker'){try{const d=await workerCall('worker-data',{from:monthStart(),to:monthEnd()});employees=d.employees||[];shifts={};(d.shifts||[]).forEach(x=>{(shifts[x.shift_date]??=[]).push(x)});workerId=d.employeeId;render();status('Přihlášen pracovník – upravovat lze pouze vlastní směny.');return}catch(err){status(err.message);if(/Relace vypršela/.test(err.message))workerLogout();return}}
 const [e,s]=await Promise.all([db.from('employees').select('id,display_name,color,is_active').eq('is_active',true).order('created_at'),db.from('shifts').select('id,employee_id,shift_date,start_time,end_time').gte('shift_date',monthStart()).lte('shift_date',monthEnd())]);
 if(e.error||s.error){status('Chyba databáze: '+(e.error||s.error).message);return}employees=e.data||[];shifts={};(s.data||[]).forEach(x=>{(shifts[x.shift_date]??=[]).push(x)});render();status('Online – změny se ukládají do společné databáze.');
}
function monthStart(){return month.getFullYear()+'-'+pad(month.getMonth()+1)+'-01'}
function monthEnd(){return dateId(new Date(month.getFullYear(),month.getMonth()+1,0))}
function render(){
 $('month').textContent=monthName(month);$('days').innerHTML='';$('people').innerHTML='';$('stats').innerHTML='';
 employees.forEach((e,i)=>{let row=document.createElement('div');row.className='person';let dot=document.createElement('i');dot.className='swatch';dot.style.background=e.color||colors[i%3];let input=document.createElement('input');input.value=e.display_name;input.setAttribute('aria-label','Jméno pracovníka');input.disabled=mode==='worker';input.onchange=async()=>{const name=input.value.trim();if(!name){input.value=e.display_name;return}const {error}=await db.from('employees').update({display_name:name}).eq('id',e.id);if(error){alert('Jméno se nepodařilo uložit: '+error.message);input.value=e.display_name}else{e.display_name=name;render()}};row.append(dot,input);if(mode==='admin'){let pin=document.createElement('input');pin.type='password';pin.inputMode='numeric';pin.maxLength=4;pin.placeholder='Nový PIN';pin.style.maxWidth='90px';let set=document.createElement('button');set.type='button';set.textContent='Nastavit';set.onclick=async()=>{if(!/^\d{4}$/.test(pin.value)){alert('PIN musí mít přesně 4 číslice.');return}set.disabled=true;try{const {data}=await db.auth.getSession();await workerCall('set-pin',{employeeId:e.id,pin:pin.value},data.session?.access_token||'');pin.value='';alert('PIN pro '+e.display_name+' byl nastaven.')}catch(err){alert('PIN se nepodařilo nastavit: '+err.message)}finally{set.disabled=false}};row.append(pin,set)}$('people').append(row)});
 const counts=employees.map(e=>Object.values(shifts).filter(a=>a.some(x=>x.employee_id===e.id)).length);const hours=employees.map(e=>Object.values(shifts).flat().filter(x=>x.employee_id===e.id).reduce((sum,x)=>sum+((Number(x.end_time.slice(0,2))*60+Number(x.end_time.slice(3,5)))-(Number(x.start_time.slice(0,2))*60+Number(x.start_time.slice(3,5))))/60,0));
 employees.forEach((e,i)=>{let r=document.createElement('div');r.className='stat';r.innerHTML='<span>'+escapeHtml(e.display_name)+'</span><b>'+counts[i]+' dní · '+hours[i]+' h</b>';$('stats').append(r)});
 let first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(1-offset);
 for(let j=0;j<42;j++){let d=new Date(start);d.setDate(start.getDate()+j);let k=dateId(d),b=document.createElement('button');b.className='day'+(d.getMonth()!==month.getMonth()?' out':'');let num=document.createElement('span');num.className='num';num.textContent=d.getDate();b.append(num);employees.forEach((e,i)=>{const rec=(shifts[k]||[]).find(x=>x.employee_id===e.id);if(rec){let t=document.createElement('span');t.className='tag';t.style.background=e.color||colors[i%3];t.textContent=e.display_name+' '+rec.start_time.slice(0,5)+'–'+rec.end_time.slice(0,5);b.append(t)}});b.onclick=()=>open(d);$('days').append(b)}
}
function open(d){selected=dateId(d);const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const y=new Date(todayKey+'T00:00:00Z');y.setUTCDate(y.getUTCDate()-1);const yesterdayKey=y.toISOString().slice(0,10);const past=selected<todayKey,isYesterday=selected===yesterdayKey,lockedPast=mode==='worker'&&past&&!isYesterday,yesterdayWorkerEdit=mode==='worker'&&isYesterday;const records=shifts[selected]||[];draft=records.map(x=>x.employee_id);draftTimes={};records.forEach(x=>draftTimes[x.employee_id]={start:x.start_time.slice(0,5),end:x.end_time.slice(0,5)});const hasYesterdayShift=records.some(x=>x.employee_id===workerId);$('date').textContent=label(d)+(lockedPast?' — starší směnu může upravovat pouze správce':yesterdayWorkerEdit?' — lze upravit pouze čas odchodu':'');$('opts').innerHTML='';(mode==='worker'?employees.filter(e=>e.id===workerId):employees).forEach((e,i)=>{let l=document.createElement('div');l.className='opt';let c=document.createElement('input');c.type='checkbox';c.checked=draft.includes(e.id);c.disabled=lockedPast||yesterdayWorkerEdit;c.onchange=()=>{draft=c.checked?[...draft,e.id]:draft.filter(x=>x!==e.id);if(c.checked&&!draftTimes[e.id])draftTimes[e.id]={start:'10:00',end:'22:00'};};let sw=document.createElement('i');sw.className='swatch';sw.style.background=e.color||colors[i%3];let name=document.createElement('span');name.textContent=e.display_name;const makeTime=(key)=>{let sel=document.createElement('select');sel.style.padding='5px';sel.style.maxWidth='92px';for(let h=0;h<24;h++)for(let m of [0,30]){let v=pad(h)+':'+pad(m),o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)}sel.value=(draftTimes[e.id]||{start:'10:00',end:'22:00'})[key];sel.disabled=lockedPast||(yesterdayWorkerEdit&&key==='start')||(yesterdayWorkerEdit&&!hasYesterdayShift);sel.onchange=()=>{draftTimes[e.id]=draftTimes[e.id]||{start:'10:00',end:'22:00'};draftTimes[e.id][key]=sel.value};return sel};let times=document.createElement('span');times.style.marginLeft='auto';times.style.display='flex';times.style.gap='4px';times.append(makeTime('start'),document.createTextNode('–'),makeTime('end'));l.append(c,sw,name,times);$('opts').append(l)});$('clear').disabled=lockedPast||yesterdayWorkerEdit;$('save').disabled=lockedPast||(yesterdayWorkerEdit&&!hasYesterdayShift);$('clear').title=lockedPast?'Starší směny může mazat pouze správce':yesterdayWorkerEdit?'Včerejší směnu nelze smazat':'';$('back').classList.add('show')}
function close(){ $('back').classList.remove('show');$('save').disabled=false }
$('save').onclick=async()=>{const old=shifts[selected]||[],oldIds=old.map(x=>x.employee_id),add=draft.filter(x=>!oldIds.includes(x)),remove=oldIds.filter(x=>!draft.includes(x));if(mode==='worker'&&selected<new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())){const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const y=new Date(todayKey+'T00:00:00Z');y.setUTCDate(y.getUTCDate()-1);const yesterdayKey=y.toISOString().slice(0,10);if(selected!==yesterdayKey||!old.some(x=>x.employee_id===workerId)||!draft.includes(workerId)){alert('Starší směny může upravovat pouze správce.');return}}for(const id of draft){const t=draftTimes[id]||{start:'10:00',end:'22:00'};if(t.start>=t.end){alert('Čas odchodu musí být později než čas příchodu.');return}}$('save').disabled=true;try{if(mode==='worker'){const t=draftTimes[workerId]||{start:'10:00',end:'22:00'};await workerCall('worker-set-shift',{date:selected,assigned:draft.includes(workerId),startTime:t.start,endTime:t.end});if(draft.includes(workerId))shifts[selected]=[{employee_id:workerId,start_time:t.start,end_time:t.end}];else delete shifts[selected]}else{if(draft.length){const {error}=await db.from('shifts').upsert(draft.map(employee_id=>({employee_id,shift_date:selected,start_time:(draftTimes[employee_id]||{start:'10:00',end:'22:00'}).start,end_time:(draftTimes[employee_id]||{start:'10:00',end:'22:00'}).end})),{onConflict:'employee_id,shift_date'});if(error)throw error}if(remove.length){const {error}=await db.from('shifts').delete().eq('shift_date',selected).in('employee_id',remove);if(error)throw error}if(draft.length)shifts[selected]=draft.map(employee_id=>({employee_id,start_time:(draftTimes[employee_id]||{start:'10:00',end:'22:00'}).start,end_time:(draftTimes[employee_id]||{start:'10:00',end:'22:00'}).end}));else delete shifts[selected]}render();close();status('Směna uložena online.')}catch(e){alert('Uložení se nezdařilo: '+e.message)}finally{$('save').disabled=false}};
$('clear').onclick=()=>{draft=[];$('save').click()};$('cancel').onclick=close;
$('prev').onclick=async()=>{month.setMonth(month.getMonth()-1);await loadData()};$('next').onclick=async()=>{month.setMonth(month.getMonth()+1);await loadData()};$('today').onclick=async()=>{month=new Date(today.getFullYear(),today.getMonth(),1);await loadData()};$('print').onclick=()=>print();
async function workerLogout(){try{if(workerToken)await workerCall('worker-logout',{},workerToken)}catch{}workerToken='';workerId='';sessionStorage.removeItem('workerSession');mode='admin';$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.add('show');$('who').textContent=''}
async function startSession(session){if(!session){if(workerToken){mode='worker';$('login').classList.remove('show');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent='Pracovník';await loadData();return}$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.add('show');$('who').textContent='';return}
 const role=session.user.app_metadata?.role;
 if(role!=='admin'){await db.auth.signOut();$('loginError').textContent='Tento účet nemá administrátorská oprávnění.';return}
 mode='admin';workerToken='';workerId='';sessionStorage.removeItem('workerSession');$('login').classList.remove('show');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=session.user.email||'Správce';await loadData();
}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginError').textContent='Přihlašuji…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent='Přihlášení se nezdařilo: '+error.message;return}await startSession(data.session)};
$('logout').onclick=async()=>{if(mode==='worker'){await workerLogout();return}await db.auth.signOut();await startSession(null)};
$('adminTab').onclick=()=>{$('adminTab').classList.add('primary');$('workerTab').classList.remove('primary');$('adminLogin').classList.remove('hidden');$('workerLogin').classList.add('hidden')};$('workerTab').onclick=()=>{$('workerTab').classList.add('primary');$('adminTab').classList.remove('primary');$('workerLogin').classList.remove('hidden');$('adminLogin').classList.add('hidden')};
$('workerLoginForm').onsubmit=async ev=>{ev.preventDefault();$('workerError').textContent='Ověřuji PIN…';try{const d=await workerCall('worker-login',{employeeId:$('workerName').value,pin:$('workerPin').value},'');workerToken=d.token;workerId=d.employee.id;sessionStorage.setItem('workerSession',workerToken);mode='worker';$('workerPin').value='';$('login').classList.remove('show');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=d.employee.display_name;await loadData()}catch(err){$('workerError').textContent=err.message}};
db.auth.onAuthStateChange((_event,session)=>{if(session&&!workerToken)startSession(session)});
db.auth.getSession().then(({data})=>{if(workerToken){mode='worker';startSession(null)}else startSession(data.session)});
})();
</script></body></html>
